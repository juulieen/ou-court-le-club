# Service notifieur RunEvent86 — déployé automatiquement par la CI
# (.github/workflows/deploy-notify.yml) sur le serveur perso.
# Déploiement manuel : copier .env.example en .env, le remplir, puis
#   docker compose -f compose.yaml up -d --build
services:
  runevent86-notify:
    build: .
    container_name: runevent86-notify
    restart: unless-stopped
    environment:
      # Fuseau du cron : 11h30 locale = Europe/Paris (gère l'heure été/hiver).
      TZ: Europe/Paris
      # Source des données (races.json public déployé par la CI — fallback)
      RACES_URL: "https://juulieen.github.io/ou-court-le-club/data/races.json"
      # Noms complets dans le récap : PAT fine-grained (Actions: read sur le
      # repo) pour télécharger l'artifact scraper-data (races.json complet).
      # Vide = fallback sur le flux public (prénoms opt-in uniquement).
      GH_TOKEN: "${GH_TOKEN:-}"
      GH_REPO: "${GH_REPO:-juulieen/ou-court-le-club}"
      # API Beeper Desktop (joignable via Tailscale) — voir .env
      BEEPER_API: "${BEEPER_API:?renseigner BEEPER_API dans .env}"
      # Cible : "Note to self" par défaut (SÛR). Groupe club une fois validé :
      # voir le secret RUNEVENT86_NOTIFY_CHAT_ID_PROD sur GitHub.
      BEEPER_CHAT_ID: "${BEEPER_CHAT_ID:?renseigner BEEPER_CHAT_ID dans .env}"
      # Rappels d'expiration du token : toujours en "Note to self" (perso)
      BEEPER_REMINDER_CHAT_ID: "${BEEPER_REMINDER_CHAT_ID:-}"
      # "" = dry-run (défaut, sûr) ; "--live" = envoi réel
      NOTIFY_ARGS: "${NOTIFY_ARGS:-}"
      # Token Beeper (persisté dans le volume ; obtenu via `notify.py token`,
      # tu acceptes la popup sur le laptop ; valide ~30j, rappel auto avant expiry)
      TOKEN_PATH: "/data/beeper_token.json"
      TOKEN_REMINDER_DAYS: "3"
      # Vue privée (noms complets) : fetch-private dépose races_private.json
      # dans /private, servi par le vhost tailnet-only courses.juulieen.fr
      # (montage caddy : ~/server/runevent86-notify/private → /srv/…-private)
      PRIVATE_DIR: "/private"
    volumes:
      - runevent86-notify-data:/data
      - ./public:/public
      - ./private:/private

volumes:
  runevent86-notify-data:
